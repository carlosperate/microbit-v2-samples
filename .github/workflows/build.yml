name: Build Natively

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build-py-script:
    strategy:
      matrix:
        # macos-14 is arm64
        os: [ubuntu-22.04, macos-15-intel, macos-14, windows-2022]
        gcc: ['6-2016-q4', 'latest']  # Min version 6.2 as used in pext/yotta:latest docker image
        cmake: ['3.6.0', '']  # Empty string installs the latest CMake release
        exclude:
          # This old version of CMake does not run in Ubuntu 22.04
          - os: ubuntu-22.04
            cmake: '3.6.0'
          # Intel macOS cannot run the latest gcc (which is arm64 only)
          - os: macos-15-intel
            gcc: 'latest'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, gcc ${{ matrix.gcc }}, cmake ${{ matrix.cmake || 'latest'}}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Setup arm-none-eabi-gcc ${{ matrix.gcc }}
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ matrix.gcc }}
      - name: Setup CMake ${{ matrix.cmake }}
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ matrix.cmake }}
      - name: Install Ninja via PyPI
        run: python -m pip install ninja
      - name: Check Versions
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version
          python --version
      - name: Build default project using build.py
        run: python build.py
      - name: Upload hex file
        uses: actions/upload-artifact@v7
        with:
          name: MICROBIT-${{ matrix.os }}-gcc-${{ matrix.gcc }}-cmake-${{ matrix.cmake || 'latest' }}
          path: MICROBIT.hex
      - name: Prepare BLE example
        run: |
          rm codal.json
          mv codal.ble.json codal.json
          python -c "import pathlib; \
            f=pathlib.Path('source/main.cpp'); \
            f.write_text(f.read_text().replace('out_of_box_experience()', 'ble_test()'))"
          cat codal.json
      - name: Build BLE project using build.py
        run: python build.py --clean
      - name: Upload BLE hex file
        uses: actions/upload-artifact@v7
        with:
          name: MICROBIT-BLE-${{ matrix.os }}-gcc-${{ matrix.gcc }}-cmake-${{ matrix.cmake || 'latest' }}
          path: MICROBIT.hex

  # LLVM is an experimental toolchain not officially supported.
  # Using Arm Toolchain for Embedded (ATfE) version with its newlib-nano overlay
  build-py-script-clang:
    strategy:
      matrix:
        # Oldest and latest ATfE releases, https://github.com/arm/arm-toolchain/releases
        atfe: ['20.1.0', '22.1.0']
      fail-fast: false
    runs-on: ubuntu-22.04
    name: ubuntu-22.04, clang ATfE ${{ matrix.atfe }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'
      - name: Setup ATfE ${{ matrix.atfe }} with the newlib-nano overlay
        working-directory: ${{ runner.temp }}
        run: |
          BASE_URL="https://github.com/arm/arm-toolchain/releases/download/release-${{ matrix.atfe }}-ATfE"
          wget -q "${BASE_URL}/ATfE-${{ matrix.atfe }}-Linux-x86_64.tar.xz" \
                  "${BASE_URL}/ATfE-${{ matrix.atfe }}-Linux-x86_64.tar.xz.sha256" \
                  "${BASE_URL}/ATfE-newlib-nano-overlay-${{ matrix.atfe }}.tar.xz" \
                  "${BASE_URL}/ATfE-newlib-nano-overlay-${{ matrix.atfe }}.tar.xz.sha256"
          sha256sum -c "ATfE-${{ matrix.atfe }}-Linux-x86_64.tar.xz.sha256"
          sha256sum -c "ATfE-newlib-nano-overlay-${{ matrix.atfe }}.tar.xz.sha256"
          tar -xf "ATfE-${{ matrix.atfe }}-Linux-x86_64.tar.xz" -C "$HOME"
          tar -xf "ATfE-newlib-nano-overlay-${{ matrix.atfe }}.tar.xz" -C "$HOME/ATfE-${{ matrix.atfe }}-Linux-x86_64"
          echo "$HOME/ATfE-${{ matrix.atfe }}-Linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Install Ninja via PyPI
        run: python -m pip install ninja
      - name: Check Versions
        run: |
          clang --version
          cmake --version
          ninja --version
          python --version
      - name: Build default project using build.py
        run: CODAL_TOOLCHAIN=CLANG python build.py
      - name: Upload hex file
        uses: actions/upload-artifact@v7
        with:
          name: MICROBIT-clang-atfe-${{ matrix.atfe }}
          path: MICROBIT.hex
      - name: Prepare BLE example
        run: |
          rm codal.json
          mv codal.ble.json codal.json
          python -c "import pathlib; \
            f=pathlib.Path('source/main.cpp'); \
            f.write_text(f.read_text().replace('out_of_box_experience()', 'ble_test()'))"
          cat codal.json
      - name: Build BLE project using build.py
        run: CODAL_TOOLCHAIN=CLANG python build.py --clean
      - name: Upload BLE hex file
        uses: actions/upload-artifact@v7
        with:
          name: MICROBIT-BLE-clang-atfe-${{ matrix.atfe }}
          path: MICROBIT.hex
